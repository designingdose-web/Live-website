    <style>
      /* Failsafe to ensure dark background and light text are applied */
      html, body {
        background-color: #0D1117;
        color: #E6EDF3;
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
      }

      html {
        scroll-behavior: smooth;
      }

      /* Failsafe for form input styling */
      input[type="text"],
      input[type="email"],
      input[type="tel"],
      textarea {
        background-color: #0D1117 !important;
        color: #FFFFFF !important;
        -webkit-text-fill-color: #FFFFFF !important; /* Ensure text color is applied on WebKit */
        caret-color: #FFFFFF !important;
      }
      input::placeholder,
      textarea::placeholder {
        color: #8D96A0 !important; /* brand-muted color */
        opacity: 1; /* Firefox needs this */
      }

      /* For scroll-triggered animations */
      .animate-on-scroll { opacity: 0; transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
      .slide-in-up { transform: translateY(30px); }
      .slide-in-left { transform: translateX(-30px); }
      .slide-in-right { transform: translateX(30px); }
      .fade-in { transition-duration: 1.2s; }
      .is-visible { opacity: 1; transform: translate(0, 0); }
      /* For the gradient text */
      .gradient-text { background-image: linear-gradient(to right, #8B5CF6, #EC4899, #22D3EE); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; }
      
      /* Fix for browser autofill styles on forms */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active,
      textarea:-webkit-autofill,
      textarea:-webkit-autofill:hover,
      textarea:-webkit-autofill:focus,
      textarea:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #0D1117 inset !important;
        -webkit-text-fill-color: #FFFFFF !important;
        caret-color: #FFFFFF !important;
      }

      /* Accessibility Styles - WCAG Focus Visible */
      :focus-visible {
        outline: 2px solid #22D3EE;
        outline-offset: 4px;
        border-radius: 2px;
      }
      
      /* Screen Reader Only Utility */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      /* Skip to Content Link - Hidden until focused */
      .skip-link {
        position: absolute;
        top: -100px;
        left: 0;
        background: #8B5CF6;
        color: white;
        padding: 12px 20px;
        z-index: 9999;
        text-decoration: none;
        font-weight: bold;
        transition: top 0.3s ease;
        border-radius: 0 0 8px 0;
      }
      .skip-link:focus {
        top: 0;
        outline: 2px solid #22D3EE;
      }

      /* Reduced Motion Preference */
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
