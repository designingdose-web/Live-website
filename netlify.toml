# Netlify Configuration File
# Optimized for Designing Dose (React SPA)

# 1. Global Security Headers for all routes (/*)
[[headers]]
  for = "/*"
  [headers.values]
    # -------------------------------------------------------------------------
    # Header 1: Strict-Transport-Security (HSTS)
    # - Enforces secure (HTTPS) connections for 2 years (63,072,000 seconds).
    # - Applies to all subdomains (includeSubDomains) and requests inclusion in the HSTS preload list.
    # -------------------------------------------------------------------------
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # -------------------------------------------------------------------------
    # Header 2: Cross-Origin-Opener-Policy (COOP)
    # - Directs browsers to safely isolate our document from cross-origin windows.
    # - Prevents side-channel sniffing attacks (Spectre) and cross-window tracking.
    # -------------------------------------------------------------------------
    Cross-Origin-Opener-Policy = "same-origin"

    # -------------------------------------------------------------------------
    # Header 3: X-Frame-Options (XFO)
    # - Prevents the document from being embedded in frames, iframes, or objects.
    # - Eliminates clickjacking risks on older browsers.
    # -------------------------------------------------------------------------
    X-Frame-Options = "DENY"

    # -------------------------------------------------------------------------
    # Header 4: X-Content-Type-Options
    # - Instructs the browser to strictly follow MIME types declared in the Content-Type header.
    # - Blocks mime-sniffing exploits (such as executing image uploads as scripts).
    # -------------------------------------------------------------------------
    X-Content-Type-Options = "nosniff"

    # -------------------------------------------------------------------------
    # Header 5: Referrer-Policy
    # - Controls how much referrer information is sent with requests.
    # - Protects privacy while maintaining safety for cross-origin navigations.
    # -------------------------------------------------------------------------
    Referrer-Policy = "strict-origin-when-cross-origin"

    # -------------------------------------------------------------------------
    # Header 6: Permissions-Policy
    # - Disables access to sensitive browser features (camera, microphone, geolocation) to protect user privacy.
    # -------------------------------------------------------------------------
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"


# 2. Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


